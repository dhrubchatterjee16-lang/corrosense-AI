[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corrosense-ai"
version = "1.0.0"
description = "Electrochemical, Nernst-Planck & Flow-Accelerated Corrosion Intelligence Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Dhrub Chatterjee", email = "dhrubchatterjee16@gmail.com"}
]
keywords = [
    "corrosion",
    "electrochemistry",
    "nernst-planck",
    "butler-volmer",
    "pitting",
    "pren",
    "sciml",
    "conformal-prediction"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
corrosense = "corrosense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
